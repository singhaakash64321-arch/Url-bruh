apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
        - name: url-shortener
          image: YOUR_DOCKERHUB_USERNAME/url-shortener:qa
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
  namespace: qa
spec:
  type: NodePort
  selector:
    app: url-shortener
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080